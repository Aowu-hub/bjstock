     Pulls in SMV2_Styles (all styles) and SMV2_Common (login + the stock list) through smv2_include().
     Viewers log in with name + PIN (SMV2Auth in SMV2_Common); an admin link (&admin=<key>) skips the login.
     10/10/2026: ?page=map  -> 🗺 Warehouse Map (SMV2Map below; Manager + Super Admin): isometric buildings + floors,
                 big search (which floor is it on), tap a floor, batch move, rules, layout editor.
                 ?page=users&admin=<key> -> 👥 Users (SMV2Users below; Super Admin): name + PIN + role.
                 ↻ Sync now also on the Warehouse page (admin link). Viewers (role VIEWER) only get STOCK MASTER.
     17/10/2026: ?page=out  -> 📦 Stock Allocations (SMV2Out below): 📦 count (admin) · 🆕 stock in · 📤 stock out, 🏭 / 🏠 (&place=NH, &mode=IN).
     One template tag per include (two in this file); comments must never spell out
     template-tag syntax. -->

/* SMV2_Styles.html — ALL styles for every page (admin, viewer, New House Stocks, login), merged 01/10/2026.
   Stock Master V2 — all CSS. Theme tokens, background system, HUD
   corner brackets and the spinning star checkbox are carried over from
   V1 (StockappStyles.html). Performance rule from V1's lag bug:
   backdrop-filter is NEVER applied to resting-state elements, only to
   the open lightbox overlay. */
:root {
  --fs: 1.15;  /* TEXT SIZE for the whole site: 1 = original, 1.15 = +15% (01/10/2026). Change this one number. */
  color-scheme: dark;
  --blue: #af0024; --blue-dark: #5d0012; --green: #6b8f5e; --red: #e04e35;
  --grey: #c7a09d; --bg: #33033c; --bg-deep: #0e0313; --card-bg: #3d0f3f;
  --border: #763b5b; --bg-panel-2: #290230; --ink: #f5e9ea; --ink-dim: #d9bdbb;
  --brass: #e04e35; --brass-light: #c7a09d; --bronze: #763b5b; --aurora-teal: #c7a09d;
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px; --radius-pill: 999px;
  --glow-brand: 0 0 22px rgba(175,0,36,.4); --glow-brand-soft: 0 0 12px rgba(175,0,36,.22);
  --glow-ok: 0 0 18px rgba(107,143,94,.35);
  --glass-border: 1px solid rgba(199,160,157,.18);
  --glass-highlight: inset 0 1px 0 rgba(255,255,255,.05);
  --shadow-float: 0 16px 36px -18px rgba(0,0,0,.75);
  --ease-smooth: cubic-bezier(.2,.7,.3,1); --t-fast: .15s; --t-med: .25s;
  --mono: 'JetBrains Mono', Consolas, monospace;
  --sans: 'Sarabun', -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* buttons with display:inline-flex would otherwise ignore hidden */
html, body { overflow-x: clip; } /* HUD corner brackets sit 2px outside their box */
body {
  margin: 0; font-family: var(--sans); color: var(--ink); background-color: var(--bg-deep);
  position: relative; min-height: 100vh; line-height: 1.5; font-size: calc(15px * var(--fs));
  overflow-wrap: anywhere; word-break: break-word;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(rgba(224,78,53,.35) 1px, transparent 1.5px),
    repeating-linear-gradient(0deg, rgba(224,78,53,.05) 0, rgba(224,78,53,.05) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(224,78,53,.05) 0, rgba(224,78,53,.05) 1px, transparent 1px, transparent 40px),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 50%, var(--bg-deep) 100%);
  background-size: 40px 40px, 40px 40px, 40px 40px, 100% 100%;
}
/* 12/10/2026: the aurora drifts with transform only (GPU layer, painted once). It used to move background-position, which
   repainted the whole screen every frame — typing in the login / search boxes lagged (94 ms per key on a slow PC, now 17 ms). */
body::after {
  content: ''; position: fixed; inset: -6%; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(ellipse 60% 40% at 15% -10%, rgba(175,0,36,.24), transparent 60%),
    radial-gradient(ellipse 55% 45% at 85% 0%, rgba(224,78,53,.17), transparent 60%),
    radial-gradient(ellipse 50% 40% at 50% 100%, rgba(118,59,91,.20), transparent 60%),
    radial-gradient(ellipse 45% 35% at 4% 62%, rgba(93,0,18,.24), transparent 60%),
    radial-gradient(ellipse 42% 38% at 96% 58%, rgba(51,3,60,.30), transparent 60%);
  will-change: transform; transform: translate3d(0, 0, 0);
  animation: auroraDrift 34s ease-in-out infinite alternate;
}
@keyframes auroraDrift {
  0%   { transform: translate3d(-2%, -1.5%, 0) scale(1); }
  100% { transform: translate3d(2.5%, 2%, 0) scale(1.05); }
}
@media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
body.lgOn::after { animation-play-state: paused; }        /* login card open: nothing moves behind it */
::selection { background: var(--red); color: #0a0e14; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: linear-gradient(var(--blue-dark), var(--bronze)); border-radius: 6px; border: 2px solid var(--bg); }

/* HUD corner brackets (V1). Elements using it set their own position. */
.hud-frame::before, .hud-frame::after {
  content: ''; position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 2;
  border: 2px solid var(--red); opacity: .65; filter: drop-shadow(0 0 5px rgba(224,78,53,.5));
}
.hud-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: var(--radius-md) 0 0 0; }
.hud-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 var(--radius-md) 0; }

/* ---------------- Header / search ---------------- */
header {
  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.2)), var(--card-bg);
  border-bottom: var(--glass-border);
  box-shadow: 0 1px 0 rgba(224,78,53,.5), 0 6px 24px -12px rgba(175,0,36,.5);
  padding: 12px 16px; position: sticky; top: 0; z-index: 5;
}
.headerInner { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.brandRow { text-align: center; }
.appTitle {
  margin: 0; font-family: var(--mono); font-size: calc(22px * var(--fs)); letter-spacing: .12em; color: var(--ink);
  text-shadow: 0 0 12px rgba(224,78,53,.55);
}
.appTitle .v2 { color: var(--red); }
.tagline { font-size: calc(14px * var(--fs)); color: var(--ink-dim); }
.statRow { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.stat {
  font-family: var(--mono); font-size: calc(12.5px * var(--fs)); padding: 3px 12px; border-radius: var(--radius-pill);
  border: var(--glass-border); background: rgba(0,0,0,.25); color: var(--ink-dim);
}
.stat b { color: var(--ink); }
.searchWrap { display: flex; gap: 8px; max-width: 900px; width: 100%; margin: 0 auto; }
input[type=text], input[type=search] {
  flex: 1; min-width: 0; font-family: var(--sans); font-size: calc(15px * var(--fs)); color: var(--ink);
  background: rgba(0,0,0,.35); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 12px; outline: none; transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
input[type=text]:focus, input[type=search]:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(224,78,53,.2); }
#searchInput { font-size: calc(16px * var(--fs)); padding: 11px 14px; }

.chipRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 1100px; margin: 0 auto; }
.chipRow:empty { display: none; }
.chip {
  font-family: var(--sans); font-size: calc(13.5px * var(--fs)); color: var(--ink); cursor: pointer;
  padding: 4px 12px; border-radius: var(--radius-pill); border: 1px solid var(--border);
  background: rgba(0,0,0,.3); transition: all var(--t-fast);
}
.chip:hover { border-color: var(--red); box-shadow: var(--glow-brand-soft); }
.chip .n { font-family: var(--mono); font-size: calc(11.5px * var(--fs)); color: var(--ink-dim); margin-left: 6px; }
.chipRow.active .chip { background: linear-gradient(120deg, var(--blue), var(--blue-dark)); border-color: transparent; box-shadow: var(--glow-brand); }
.chipRow.active .chip::after { content: ' ✕'; opacity: .7; }
.chip.suggestion { border-style: dashed; color: var(--ink-dim); }
.chip.suggestion::before { content: '+ '; }

.filterRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); overflow: hidden; }
.seg button {
  font-family: var(--sans); font-size: calc(13px * var(--fs)); color: var(--ink-dim); background: transparent; border: none;
  padding: 6px 12px; cursor: pointer; transition: all var(--t-fast);
}
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: linear-gradient(120deg, var(--blue), var(--blue-dark)); color: var(--ink); box-shadow: var(--glow-brand-soft); }

/* ---------------- Buttons ---------------- */
.btn-ghost, .btn-primary {
  font-family: var(--sans); font-size: calc(13.5px * var(--fs)); color: var(--ink); cursor: pointer; text-decoration: none;
  padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  background: rgba(0,0,0,.25); transition: all var(--t-fast) var(--ease-smooth); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost:hover:not([disabled]) { border-color: var(--red); box-shadow: var(--glow-brand-soft); transform: translateY(-1px); }
.btn-ghost:active:not([disabled]) { transform: scale(.97); }
.btn-primary { background: linear-gradient(120deg, var(--blue), var(--blue-dark)); border-color: transparent; box-shadow: var(--glow-brand-soft); }
.btn-primary:hover { box-shadow: var(--glow-brand); }
.btn-ghost[disabled] { opacity: .5; cursor: default; }
.small { padding: 4px 10px; font-size: calc(12.5px * var(--fs)); }
.count { font-family: var(--mono); font-size: calc(11.5px * var(--fs)); background: var(--blue); border-radius: var(--radius-pill); padding: 0 7px; }

/* ---------------- Feed / cards ---------------- */
main { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 18px 16px 60px; }
.feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; align-items: start; }
.card {
  position: relative; border-radius: var(--radius-md); padding: 12px 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(0,0,0,.18)), var(--card-bg);
  border: var(--glass-border); box-shadow: var(--glass-highlight), var(--shadow-float);
  display: flex; flex-direction: column; gap: 8px; transition: border-color var(--t-med), opacity var(--t-med);
}
.card.isChecked { border-color: rgba(107,143,94,.55); box-shadow: var(--glass-highlight), var(--glow-ok); }
.card.isNotStock { opacity: .55; }
.card.flash { animation: flashIn 1.2s var(--ease-smooth); }
@keyframes flashIn { 0% { box-shadow: 0 0 0 2px var(--red), var(--glow-brand); } 100% { box-shadow: var(--glass-highlight), var(--shadow-float); } }
.cardTop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cardDate { font-family: var(--mono); font-size: calc(13px * var(--fs)); color: var(--ink); }
.badge {
  font-family: var(--mono); font-size: calc(11px * var(--fs)); letter-spacing: .06em; padding: 1px 8px;
  border-radius: var(--radius-pill); border: 1px solid var(--border); color: var(--ink-dim);
}
.badge.text { border-color: #7c9bff; color: #b9c8ff; }
.badge.image { border-color: #5ce1c2; color: #a8f0df; }
.badge.dup { border-color: #ffb85c; color: #ffd9a3; cursor: pointer; }
.badge.ns { border-color: var(--red); color: var(--red); }
.cardSender { font-size: calc(12.5px * var(--fs)); color: var(--ink-dim); margin-left: auto; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cardText {
  white-space: pre-wrap; font-size: calc(15px * var(--fs)); background: rgba(0,0,0,.25); border-radius: var(--radius-sm);
  padding: 8px 10px; max-height: 260px; overflow: auto; border: 1px solid rgba(118,59,91,.5);
}
.cardImgWrap { border-radius: var(--radius-sm); overflow: hidden; background: rgba(0,0,0,.35); cursor: zoom-in; min-height: 120px; display: flex; align-items: center; justify-content: center; }
.cardImg { display: block; width: 100%; max-height: 360px; object-fit: contain; }
.imgBroken { padding: 30px 10px; font-size: calc(13px * var(--fs)); color: var(--ink-dim); text-align: center; }
.headingHint { font-size: calc(12.5px * var(--fs)); color: var(--ink-dim); font-family: var(--mono); }
mark { background: rgba(224,78,53,.45); color: var(--ink); border-radius: 3px; padding: 0 2px; }

.cardBar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tagToggle { position: relative; }
.tagToggle .dot { position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: #ffb85c; box-shadow: 0 0 8px #ffb85c; }
/* Tag preview sits on its OWN full-width row under the buttons. As a flex:1 item
   squeezed between the buttons it shrank to ~0 width, and overflow-wrap:anywhere
   then broke long section names one letter per line (bug seen live 25/09/2026). */
.tagPreview { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 100%; order: 10; min-width: 0; }
.tagPreview:empty { display: none; }
.tagPreview span {
  font-size: calc(12.5px * var(--fs)); padding: 1px 10px; border-radius: var(--radius-pill);
  background: rgba(175,0,36,.35); border: 1px solid rgba(224,78,53,.4);
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  overflow-wrap: normal; word-break: normal;
}
.cardStatus { font-size: calc(12px * var(--fs)); color: var(--ink-dim); font-family: var(--mono); min-height: 1em; }
.cardStatus.err { color: var(--red); }

/* Tag panel (collapsed by default, opened via the tag icon) */
.tagPanel { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.tagPanel[hidden] { display: none; }
.suggestRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: calc(12.5px * var(--fs)); color: var(--ink-dim); }
.secBlock { border: 1px solid rgba(118,59,91,.7); border-radius: var(--radius-sm); padding: 8px 10px; background: rgba(0,0,0,.2); }
.secHead { display: flex; align-items: center; gap: 8px; }
.secName { font-weight: 600; flex: 1; }
.xBtn { background: none; border: none; color: var(--ink-dim); cursor: pointer; font-size: calc(14px * var(--fs)); padding: 2px 6px; border-radius: 6px; }
.xBtn:hover { color: var(--red); background: rgba(224,78,53,.12); }
.itemList { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.itemPill { font-size: calc(13px * var(--fs)); padding: 1px 4px 1px 10px; border-radius: var(--radius-pill); border: 1px solid var(--border); display: inline-flex; align-items: center; }
.pickWrap { position: relative; display: flex; gap: 6px; }
.pickList {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 4px; max-height: 230px; overflow: auto;
  background: var(--bg-panel-2); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-float);
}
.pickList[hidden] { display: none; }
.pickList div { padding: 7px 10px; cursor: pointer; font-size: calc(14px * var(--fs)); }
.pickList div:hover, .pickList div.hl { background: rgba(175,0,36,.4); }
.pickList div.new { color: #ffd9a3; font-style: italic; }

/* ---------------- Star checkbox (V1 "Checkbox #31", unchanged look) ---------------- */
.starLabel {
  position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: calc(13px * var(--fs));
  color: var(--ink-dim); cursor: pointer; padding: 5px 12px 5px 8px; border-radius: var(--radius-md);
  border: 2px solid transparent; background: rgba(0,0,0,.18); transition: color .25s, box-shadow .25s; user-select: none;
}
.starLabel.checked {
  color: var(--ink);
  background: linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.22)) padding-box,
              conic-gradient(from 0deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2) border-box;
  box-shadow: 0 0 14px -2px rgba(124,155,255,.5);
}
.starCheckboxInput { position: absolute; opacity: 0; width: 0; height: 0; }
.starCheckboxBox { display: inline-block; width: 26px; height: 26px; flex: none; position: relative; transition: transform .6s cubic-bezier(.22,1,.36,1); }
.starLabel .glow, .starLabel .ring, .starLabel .star {
  position: absolute; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.starLabel .glow { inset: -5px; z-index: 0; background: #5ce1c2; filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .25s; }
.starLabel:hover .glow { opacity: .55; }
.starCheckboxInput:checked ~ .starCheckboxBox .glow { opacity: 1; background: conic-gradient(from 0deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2); animation: aurora-spin 2.2s linear infinite; }
.starLabel .ring { inset: 0; z-index: 1; background: #3a4863; transition: background .3s; }
.starCheckboxInput:checked ~ .starCheckboxBox .ring { background: conic-gradient(from 0deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2); animation: aurora-spin 2.2s linear infinite; }
.starLabel .star { inset: 2px; z-index: 2; background: repeating-radial-gradient(circle at 50% 52%, #232a35 0 2px, #171c24 2px 4px); transition: background .3s; }
.starCheckboxInput:checked ~ .starCheckboxBox .star {
  background: repeating-radial-gradient(circle at 50% 52%, rgba(255,255,255,.4) 0 2px, rgba(255,255,255,.1) 2px 4px), linear-gradient(160deg, #5ce1c2, #7c9bff);
}
@keyframes aurora-spin { to { transform: rotate(360deg); } }

/* ---------------- Loading / empty / toast ---------------- */
.loading { text-align: center; padding: 60px 0; color: var(--ink-dim); font-family: var(--mono); }
.loading[hidden] { display: none; }
.scanbar { width: 220px; height: 3px; margin: 0 auto 14px; background: linear-gradient(90deg, transparent, var(--red), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: scan 1.2s linear infinite; }
@keyframes scan { from { background-position: -110px 0; } to { background-position: 330px 0; } }
.emptyMsg { text-align: center; padding: 50px 0; color: var(--ink-dim); }
.sentinel { height: 40px; }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
  background: var(--bg-panel-2); border: 1px solid var(--red); border-radius: var(--radius-sm);
  padding: 9px 16px; box-shadow: var(--glow-brand); font-size: calc(14px * var(--fs));
}
.toast[hidden] { display: none; }
.spin-ico { display: inline-block; width: 11px; height: 11px; border: 2px solid var(--ink-dim); border-top-color: transparent; border-radius: 50%; animation: aurora-spin .8s linear infinite; vertical-align: -1px; margin-right: 5px; }

/* ---------------- Lightbox / skipped panel ---------------- */
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(8,2,12,.82); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox[hidden] { display: none; }
.lightboxInner { max-width: 1100px; width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); border: var(--glass-border); border-radius: var(--radius-md); padding: 12px; overflow: auto; }
.lightboxInner.wide { max-width: 1400px; }
.lightboxBar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#lightboxImg { width: 100%; max-height: 80vh; object-fit: contain; }
.hint { margin: 0; font-size: calc(13px * var(--fs)); color: var(--ink-dim); }
.skippedGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.skipCard { border: var(--glass-border); border-radius: var(--radius-sm); padding: 8px; background: rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 6px; font-size: calc(12.5px * var(--fs)); }
.skipCard img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: rgba(0,0,0,.3); }
.skipMeta { font-family: var(--mono); color: var(--ink-dim); font-size: calc(11.5px * var(--fs)); }

/* =====================================================================
   LOADING SYSTEM (25/09/2026) — one aurora loader used everywhere:
   boot screen, full-screen block overlay, card cover, busy pill,
   image stages. Same aurora conic palette as the star checkbox.
   ===================================================================== */
.auroraLoader { position: relative; display: inline-block; width: 22px; height: 22px; flex: none; }
.auroraLoader::before, .auroraLoader > span {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation: aurora-spin 1s linear infinite;
}
.auroraLoader > span { filter: blur(6px); opacity: .85; } /* glow halo */
.auroraLoader.big { width: 58px; height: 58px; }
.auroraLoader.big::before, .auroraLoader.big > span {
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
}
.auroraLoader.tiny { width: 15px; height: 15px; }
.auroraText {
  background: linear-gradient(90deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2); background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: auroraShift 3s linear infinite;
}
@keyframes auroraShift { to { background-position: 300% 0; } }

/* Boot / welcome screen */
.bootScreen {
  position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(51,3,60,.96), rgba(14,3,19,.99));
  transition: opacity .45s var(--ease-smooth), visibility .45s;
}
.bootScreen.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.bootCard {
  position: relative; width: min(580px, 100%); text-align: center; padding: 26px 20px 20px;
  background: linear-gradient(160deg, var(--card-bg), var(--bg-panel-2));
  border: var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--glass-highlight), var(--shadow-float), 0 0 60px -20px rgba(124,155,255,.45);
}
.bootTitle { margin-top: 14px; font-family: var(--mono); font-size: calc(24px * var(--fs)); letter-spacing: .14em; font-weight: 700; text-shadow: 0 0 14px rgba(224,78,53,.55); }
.bootTitle .v2 { color: var(--red); }
.bootSub { color: var(--ink-dim); font-size: calc(14px * var(--fs)); margin-bottom: 14px; }
.terminalScreen {
  position: relative; border-radius: var(--radius-sm); background: rgba(14,3,19,.55);
  box-shadow: inset 0 2px 10px rgba(0,0,0,.4); overflow: hidden; text-align: left;
}
.terminalScreen::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px);
}
.terminalBody {
  margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: calc(12.5px * var(--fs)); line-height: 1.7; color: var(--ink);
  text-shadow: 0 0 3px rgba(245,233,234,.35); white-space: pre-wrap; word-break: break-word; height: 190px; overflow-y: auto;
}
.terminalPrompt { color: var(--brass-light); }
.terminalTag { display: inline-block; padding: 0 8px; border-radius: var(--radius-pill); font-size: calc(11.5px * var(--fs)); font-weight: 700; border: 1px solid currentColor; margin-left: 6px; }
.terminalOk { color: #5ce1c2; background: rgba(92,225,194,.1); }
.terminalErr { color: var(--red); background: rgba(224,78,53,.14); }
.terminalCursor { display: inline-block; width: 8px; height: 14px; background: #7c9bff; box-shadow: 0 0 6px #7c9bff; vertical-align: -2px; animation: terminalBlink 1s step-end infinite; }
@keyframes terminalBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
.bootProgress { margin-top: 14px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; }
#bootProgressFill { height: 100%; width: 5%; border-radius: 4px; background: linear-gradient(90deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c); box-shadow: 0 0 10px #7c9bff; transition: width .4s var(--ease-smooth); }

/* Global busy bar + pill */
.busyBar {
  position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70;
  background: linear-gradient(90deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2); background-size: 200% 100%;
  animation: auroraShift 1.2s linear infinite; box-shadow: 0 0 12px #7c9bff;
}
.busyBar[hidden], .busyPill[hidden], .blockOverlay[hidden] { display: none; }
.busyPill {
  position: fixed; right: 16px; bottom: 16px; z-index: 70; display: flex; align-items: center; gap: 8px;
  padding: 7px 14px 7px 10px; border-radius: var(--radius-pill); font-size: calc(13px * var(--fs));
  background: var(--bg-panel-2); border: 1px solid rgba(124,155,255,.5); box-shadow: 0 0 16px -4px rgba(124,155,255,.6);
}
.busyPill.slow { border-color: #ffb85c; box-shadow: 0 0 16px -4px rgba(255,184,92,.7); }

/* Full-screen block overlay (view-changing actions) */
.blockOverlay { position: fixed; inset: 0; z-index: 75; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8,2,12,.72); }
.blockCard { position: relative; text-align: center; padding: 26px 30px; min-width: 260px; max-width: 460px; border-radius: var(--radius-md); background: linear-gradient(160deg, var(--card-bg), var(--bg-panel-2)); border: var(--glass-border); box-shadow: var(--shadow-float); }
.blockText { margin-top: 14px; font-size: calc(16px * var(--fs)); font-weight: 600; }
.blockSub { margin-top: 6px; font-size: calc(13px * var(--fs)); color: var(--ink-dim); min-height: 1em; }

/* Card cover while a Done / Not stock save is running */
.cardCover {
  position: absolute; inset: 0; z-index: 6; border-radius: var(--radius-md);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: rgba(20,4,26,.88); font-size: calc(14px * var(--fs)); font-weight: 600;
  padding: 16px; text-align: center; overflow: hidden;
  animation: fadeIn .18s ease-out;
}
.cardCover .coverSub { font-size: calc(12px * var(--fs)); font-weight: 400; color: var(--ink-dim); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.card.leaving { animation: cardLeave .42s var(--ease-smooth) forwards; }
@keyframes cardLeave { to { opacity: 0; transform: scale(.94) translateY(-8px); } }
/* thin aurora line on a card while its tags are saving (non-blocking, so typing can continue) */
.card.savingTags::after {
  content: ''; position: absolute; left: 12px; right: 12px; top: 0; height: 2px; border-radius: 2px; z-index: 3;
  background: linear-gradient(90deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2); background-size: 200% 100%;
  animation: auroraShift 1s linear infinite;
}

/* Image stages: aurora loader shows until the picture arrives */
.imgStage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 160px; }
.imgStage .auroraLoader { position: absolute; top: 50%; left: 50%; margin: -29px 0 0 -29px; }
.imgStage.loaded .auroraLoader { display: none; }
.cardImgWrap { position: relative; }
.cardImgWrap .auroraLoader { position: absolute; top: 50%; left: 50%; margin: -11px 0 0 -11px; }
.cardImgWrap.loaded .auroraLoader { display: none; }

/* ---------------- Search highlight ---------------- */
.card.searchHit {
  border-color: rgba(124,155,255,.85);
  box-shadow: var(--glass-highlight), 0 0 0 1px rgba(124,155,255,.35), 0 0 24px -6px rgba(124,155,255,.65);
}
.matchRow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: calc(12px * var(--fs)); color: var(--ink-dim); }
.matchRow:empty { display: none; }
.matchRow .mt { padding: 0 8px; border-radius: var(--radius-pill); border: 1px solid rgba(124,155,255,.55); color: #c9d5ff; background: rgba(124,155,255,.12); }
.tagPreview span.hit { background: rgba(124,155,255,.3); border-color: #7c9bff; box-shadow: 0 0 8px -2px #7c9bff; }
.itemPill.hit, .secBlock.hit { border-color: #7c9bff; box-shadow: 0 0 8px -2px #7c9bff; }
mark { background: linear-gradient(90deg, rgba(92,225,194,.45), rgba(124,155,255,.45)); color: #fff; }

/* ---------------- Picker add button + draft ---------------- */
.pickWrap input.hasDraft { border-color: #ffb85c; box-shadow: 0 0 0 2px rgba(255,184,92,.18); }
.pickAdd { flex: none; }

/* ---------------- Duplicate compare ---------------- */
.compareGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compareCol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.compareHead { font-family: var(--mono); font-size: calc(12.5px * var(--fs)); color: var(--ink-dim); letter-spacing: .05em; }
.compareCol img { width: 100%; max-height: 62vh; object-fit: contain; background: rgba(0,0,0,.3); border-radius: var(--radius-sm); }
.compareActions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
@media (max-width: 640px) { .compareGrid { grid-template-columns: 1fr; } }

/* ---------------- Free #tags (YouTube-style keywords) — 26/09/2026 ---------------- */
.kwRow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.kw {
  display: inline-flex; align-items: center; font-size: calc(12.5px * var(--fs)); line-height: 1.6;
  padding: 0 2px 0 9px; border-radius: var(--radius-pill);
  background: rgba(92,225,194,.1); border: 1px solid rgba(92,225,194,.45); color: #bff3e6;
  max-width: 100%; overflow-wrap: normal; word-break: normal;
}
.kw .kwText { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.kw .kwText:hover { text-decoration: underline; }
.kw .xBtn { font-size: calc(11px * var(--fs)); padding: 0 5px; }
.kw.hit { background: rgba(124,155,255,.28); border-color: #7c9bff; color: #fff; box-shadow: 0 0 8px -2px #7c9bff; }
.kwPicker { flex: 1 1 150px; min-width: 150px; }
.kwPicker input[type=text] { padding: 4px 10px; font-size: calc(13px * var(--fs)); border-style: dashed; background: rgba(0,0,0,.2); }
.kwPicker .pickAdd { padding: 3px 9px; font-size: calc(12px * var(--fs)); }
.chip.kwChip { border-color: rgba(92,225,194,.55); color: #bff3e6; }
.chipRow.active .chip.kwChip { background: linear-gradient(120deg, #1f7f6c, #2b4a8f); color: #fff; }

/* ---------------- Image side panel (26/09/2026) ---------------- */
.sidePanel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 50vw; z-index: 30;
  display: flex; flex-direction: column; gap: 10px; padding: 12px 14px;
  background: linear-gradient(160deg, var(--card-bg), var(--bg-panel-2));
  border-left: 1px solid rgba(124,155,255,.45);
  box-shadow: -18px 0 40px -18px rgba(0,0,0,.85), -1px 0 0 rgba(224,78,53,.35);
  transform: translateX(104%); transition: transform .32s var(--ease-smooth); visibility: hidden;
}
.sidePanel.open { transform: translateX(0); visibility: visible; }
.spBar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.spArrow { font-size: calc(18px * var(--fs)); line-height: 1; padding: 4px 12px; }
.spCount { font-family: var(--mono); font-size: calc(12px * var(--fs)); color: var(--ink-dim); min-width: 48px; text-align: center; }
.spGrow { flex: 1; }
.spCloseBtn { border-color: rgba(224,78,53,.6); }
.spInfo { display: flex; flex-direction: column; gap: 2px; }
.spTags { font-size: calc(12.5px * var(--fs)); color: var(--ink); }
.spStage { flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius-sm); background: rgba(0,0,0,.35); align-items: flex-start; }
#spImg { display: block; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
#spImg.zoom { width: auto; height: auto; max-width: none; cursor: zoom-out; }
/* feed reflows into the left half while the panel is open */
body.spOpen main { margin-right: 50vw; max-width: none; }
body.spOpen header { padding-right: calc(50vw + 16px); } /* search + filters stay usable in the left half */
body.spOpen .feed { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card.spActive { border-color: #7c9bff; box-shadow: var(--glass-highlight), 0 0 0 2px rgba(124,155,255,.55), 0 0 26px -6px rgba(124,155,255,.7); }
@media (max-width: 900px) {
  /* phones/tablets: the panel becomes a bottom sheet over the lower part of the screen */
  .sidePanel { top: auto; left: 0; width: auto; height: 58vh; border-left: none; border-top: 1px solid rgba(124,155,255,.45);
    transform: translateY(104%); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .sidePanel.open { transform: translateY(0); }
  body.spOpen main { margin-right: 0; padding-bottom: 60vh; }
  body.spOpen header { padding-right: 16px; }
}

/* ---------------- Card kinds: Stock count (blue) / New arrival (green) — 26/09/2026 ---------------- */
:root { --kind-count: #5aa9ff; --kind-count-bg: rgba(90,169,255,.10); --kind-arrival: #4fe08a; --kind-arrival-bg: rgba(79,224,138,.10); }
.card.kindCount { border-left: 4px solid var(--kind-count);
  background: linear-gradient(180deg, var(--kind-count-bg), rgba(0,0,0,.18)), var(--card-bg); }
.card.kindArrival { border-left: 4px solid var(--kind-arrival);
  background: linear-gradient(180deg, var(--kind-arrival-bg), rgba(0,0,0,.18)), var(--card-bg); }
.badge.kind { font-weight: 700; }
.badge.kind.count { border-color: var(--kind-count); color: #cfe5ff; background: rgba(90,169,255,.16); }
.badge.kind.arrival { border-color: var(--kind-arrival); color: #d3ffe3; background: rgba(79,224,138,.16); }
.kindSeg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-pill); overflow: hidden; flex: none; }
.kindSeg button { font-family: var(--sans); font-size: calc(12px * var(--fs)); padding: 4px 10px; border: none; background: transparent; color: var(--ink-dim); cursor: pointer; white-space: nowrap; transition: all var(--t-fast); }
.kindSeg button + button { border-left: 1px solid var(--border); }
.kindSeg button[data-k="COUNT"].on { background: var(--kind-count); color: #06182c; font-weight: 700; }
.kindSeg button[data-k="ARRIVAL"].on { background: var(--kind-arrival); color: #05230f; font-weight: 700; }
.kindSeg button:not(.on):hover { color: var(--ink); background: rgba(255,255,255,.06); }
#segKind button.kCount.on { background: var(--kind-count); color: #06182c; box-shadow: 0 0 12px -2px var(--kind-count); }
#segKind button.kArrival.on { background: var(--kind-arrival); color: #05230f; box-shadow: 0 0 12px -2px var(--kind-arrival); }
.stat.kindStat.kcount { border-color: rgba(90,169,255,.55); }
.stat.kindStat.karrival { border-color: rgba(79,224,138,.55); }

/* ---------------- Tag panel: Add-section on top + star checklist (26/09/2026) ---------------- */
.panelTop { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(124,155,255,.35); }
.secHead .secCount { font-family: var(--mono); font-size: calc(11.5px * var(--fs)); color: #7fe0a8; }
.itemFilter { margin: 6px 0; }
.itemFilter input[type=text] { padding: 5px 10px; font-size: calc(13px * var(--fs)); }
.checkList { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 5px; }
.checkEmpty { grid-column: 1 / -1; font-size: calc(12.5px * var(--fs)); color: var(--ink-dim); padding: 4px 2px; }
.newItemBtn, .moreItemsBtn {
  grid-column: 1 / -1; justify-self: start; font-family: var(--sans); font-size: calc(12.5px * var(--fs)); cursor: pointer;
  padding: 4px 12px; border-radius: var(--radius-pill); background: rgba(0,0,0,.25); color: var(--ink);
}
.newItemBtn { border: 1px dashed #ffb85c; color: #ffd9a3; }
.moreItemsBtn { border: 1px solid rgba(124,155,255,.5); color: #c9d5ff; }
.newItemBtn:hover, .moreItemsBtn:hover { box-shadow: var(--glow-brand-soft); }

/* mini star checkbox — simplified version of the Done star, used for all checklist ticks */
.miniStar {
  display: flex; align-items: center; gap: 7px; min-width: 0; cursor: pointer; user-select: none;
  padding: 4px 8px; border-radius: var(--radius-sm); border: 1px solid rgba(118,59,91,.7);
  background: rgba(0,0,0,.2); font-size: calc(13px * var(--fs)); color: var(--ink-dim); transition: all var(--t-fast);
}
.miniStar:hover { border-color: #7c9bff; color: var(--ink); }
.miniStar.on { color: var(--ink); border-color: rgba(124,155,255,.7); background: rgba(124,155,255,.12); }
.miniStar.hit { box-shadow: 0 0 8px -2px #7c9bff; }
.msInput { position: absolute; opacity: 0; width: 0; height: 0; }
/* star toggle switch: dark track + star knob that slides right and turns aurora when on */
.msSwitch {
  position: relative; flex: none; width: 38px; height: 20px; border-radius: 999px;
  background: #2a2236; border: 1px solid #4a3f5c; box-shadow: inset 0 1px 3px rgba(0,0,0,.5);
  transition: background .25s, border-color .25s, box-shadow .25s;
}
.msKnob {
  position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; background: #7a6f8e;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  transition: transform .35s cubic-bezier(.22,1,.36,1), background .25s, filter .25s;
}
.miniStar:hover .msSwitch { border-color: #7c9bff; }
.miniStar:hover .msKnob { background: #9a8fb0; }
.miniStar.on .msSwitch {
  background: linear-gradient(90deg, rgba(92,225,194,.55), rgba(124,155,255,.55), rgba(215,92,225,.55));
  border-color: #7c9bff; box-shadow: 0 0 10px -2px rgba(124,155,255,.8), inset 0 1px 2px rgba(0,0,0,.3);
}
.miniStar.on .msKnob {
  transform: translateX(18px) rotate(144deg);
  background: conic-gradient(from 0deg, #ffffff, #ffe9b0, #ffb85c, #ffffff);
  filter: drop-shadow(0 0 3px rgba(255,255,255,.9));
}
.msInput:focus-visible + .msSwitch { outline: 2px solid #7c9bff; outline-offset: 2px; }
.msText { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; word-break: normal; }

/* ---------------- Card action bar: one button size, same as Done (26/09/2026) ---------------- */
.cardBar { --barH: 40px; flex-direction: column; align-items: stretch; gap: 8px; }
.barRow { display: flex; gap: 6px; align-items: stretch; flex-wrap: nowrap; }  /* two controls per line, always */
.barRow > .btn-ghost, .barRow > .kindSeg, .barRow > .starLabel {
  height: var(--barH); box-sizing: border-box; font-size: calc(13px * var(--fs)); border-radius: var(--radius-md);
  flex: 1 1 0; min-width: 0; justify-content: center; white-space: nowrap; overflow: hidden;
}
.barRow > .kindSeg { flex-grow: 2.6; }
.barRow > .tagToggle { flex-grow: 1.15; }
.barRow > .starLabel { gap: 6px; }
.barRow > .starLabel .starCheckboxBox { width: 24px; height: 24px; }
.barRow .kindSeg button, .barRow .tagToggle .tbTxt, .barRow .starLabel span:last-child { overflow: hidden; text-overflow: ellipsis; }
.barRow > .btn-ghost { padding: 0 10px; border-width: 1px; }
.barRow > .starLabel { padding: 0 12px 0 8px; }
.barRow > .kindSeg { display: flex; }
.barRow > .kindSeg button { flex: 1 1 0; min-width: 0; height: 100%; padding: 0 4px; font-size: calc(12.5px * var(--fs)); }
.tagToggle { gap: 6px; border-color: rgba(92,225,194,.55); }
.tagToggle .tbIco { font-weight: 700; color: #7fe0c8; font-size: calc(15px * var(--fs)); }
.tagToggle .tbN { font-family: var(--mono); font-size: calc(11.5px * var(--fs)); min-width: 20px; text-align: center; padding: 0 6px; border-radius: var(--radius-pill); background: rgba(92,225,194,.18); color: #bff3e6; }
.tagToggle .tbArrow { font-size: calc(11px * var(--fs)); opacity: .8; }
.tagToggle.open { background: rgba(92,225,194,.14); border-color: #5ce1c2; }
@media (max-width: 640px) {
  .barRow > .btn-ghost, .barRow > .kindSeg button, .barRow > .starLabel { font-size: calc(12px * var(--fs)); }
  .barRow > .kindSeg button { padding: 0 8px; }
}

/* fast themed tooltip bubble (admin + viewer) */
.fastTip {
  position: fixed; z-index: 95; pointer-events: none; max-width: 320px;
  padding: 6px 11px; border-radius: 10px; font-family: var(--sans); font-size: calc(12.5px * var(--fs)); line-height: 1.45; color: #fff;
  background: linear-gradient(160deg, rgba(61,15,63,.97), rgba(41,2,48,.97)) padding-box,
              conic-gradient(from 0deg, #5ce1c2, #7c9bff, #d75ce1, #ffb85c, #5ce1c2) border-box;
  border: 1px solid transparent; box-shadow: 0 8px 22px -8px rgba(0,0,0,.8), 0 0 14px -4px rgba(124,155,255,.6);
  animation: tipIn .12s ease-out; overflow-wrap: anywhere;
}
@keyframes tipIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
.miniStar { position: relative; } /* keep the hidden switch input inside its own row */

.badge.auto { border-color: #d75ce1; color: #f3c9f8; background: rgba(215,92,225,.16); cursor: pointer; font-weight: 700; }
.autoNote { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid rgba(215,92,225,.55); background: rgba(215,92,225,.1); font-size: calc(12.5px * var(--fs)); color: #f3dcf6; }
.autoBtns { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------------- Manual duplicate (26/09/2026) ---------------- */
.dupBtn {
  flex: none; font-family: var(--sans); font-size: calc(11.5px * var(--fs)); cursor: pointer; padding: 1px 8px;
  border-radius: var(--radius-pill); border: 1px dashed rgba(255,184,92,.6); background: transparent; color: #ffd9a3;
}
.dupBtn:hover { background: rgba(255,184,92,.14); border-style: solid; }
.dupThis { font-size: calc(13px * var(--fs)); padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid rgba(255,184,92,.5); background: rgba(255,184,92,.08); }

.dupBtn.has { border-style: solid; border-color: #ffb85c; background: rgba(255,184,92,.16); font-weight: 700; }

.viewPage { --hdrH: 0px; }

<script>
/* ⏳ SMV2Busy (10/10/2026) — every load / save / page change shows it is happening, in the app's own look:
     SMV2Busy.part(el, text)   cover ONE part (panel, card, map) with the aurora loader + words; the rest stays usable.
                               -> h.text(t) · h.done() · h.fail(msg). After 6 s / 20 s the words add "still working" / "slower than usual".
     SMV2Busy.btn(button, text) the pressed button shows a small loader + words and is disabled -> h.done()
     SMV2Busy.saving(text)     counts a save in flight -> returns end(). While any save is in flight, leaving the page
                               (a link, a module card, closing the tab) asks first: wait or leave anyway.
     Leaving the page by a link always shows "Opening …" at the top (Apps Script pages take a few seconds to open). */
(function () {
  var B = { n: 0, labels: [], bar: null, guard: null };
  var SLOW = 6000, VSLOW = 20000;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lagText(ms) {
    return ms > VSLOW ? 'ช้ากว่าปกติ รอสักครู่ ไม่ต้องกดซ้ำ • Slower than usual — please wait, no need to press again'
      : ms > SLOW ? 'ยังทำงานอยู่ (Google อาจช้าเล็กน้อย) • Still working (Google can be a little slow)' : '';
  }
  function part(el, text) {
    if (!el) return { text: function () {}, done: function () {}, fail: function () {} };
    var cs = window.getComputedStyle ? getComputedStyle(el).position : '';
    if (cs === 'static' || cs === '') el.classList.add('bzRel');
    var ov = document.createElement('div'); ov.className = 'bzOver'; ov.setAttribute('role', 'status'); ov.setAttribute('aria-live', 'polite');
    ov.innerHTML = '<div class="bzBox"><span class="auroraLoader"><span></span></span><span class="bzT auroraText"></span><span class="bzLag"></span></div>';
    ov.querySelector('.bzT').textContent = text || 'กำลังโหลด… • Loading…';
    el.appendChild(ov); el.classList.add('bzOn'); el.setAttribute('aria-busy', 'true');
    var t0 = Date.now(), tm = setInterval(function () { ov.querySelector('.bzLag').textContent = lagText(Date.now() - t0); ov.classList.toggle('slow', Date.now() - t0 > SLOW); }, 1000);
    var end = function () { clearInterval(tm); if (ov.parentNode) ov.parentNode.removeChild(ov); if (!el.querySelector('.bzOver')) { el.classList.remove('bzOn'); el.removeAttribute('aria-busy'); } };
    return {
      text: function (t) { ov.querySelector('.bzT').textContent = t; },
      done: end,
      fail: function (msg) {
        clearInterval(tm); ov.classList.add('err');
        ov.querySelector('.bzBox').innerHTML = '<span class="bzX">✕</span><span class="bzT">' + esc(String(msg || 'ไม่สำเร็จ • Failed').replace(/^Error:\s*/, '')) + '</span><button type="button" class="btn-ghost small">ปิด • Close</button>';
        ov.querySelector('button').addEventListener('click', end);
        setTimeout(end, 9000);
      }
    };
  }
  function btn(b, text) {
    if (!b) return { done: function () {} };
    if (b._bz) return b._bz;
    var html = b.innerHTML, dis = b.disabled;
    b.disabled = true; b.classList.add('bzBtn');
    b.innerHTML = '<span class="auroraLoader tiny"><span></span></span> ' + esc(text || 'กำลังบันทึก… • Saving…');
    var h = b._bz = { done: function () { b.innerHTML = html; b.disabled = dis; b.classList.remove('bzBtn'); b._bz = null; } };
    return h;
  }
  function saving(text) {
    B.n++; B.labels.push(text || ''); var done = false;
    return function () { if (done) return; done = true; B.n = Math.max(0, B.n - 1); B.labels.shift(); if (!B.n && B.guard) B.guard.hidden = true; };
  }
  function navBar(label) {
    if (!B.bar) {
      B.bar = document.createElement('div'); B.bar.className = 'bzNav'; B.bar.setAttribute('role', 'status');
      B.bar.innerHTML = '<span class="auroraLoader tiny"><span></span></span><span class="bzT"></span>';
      document.body.appendChild(B.bar);
    }
    B.bar.querySelector('.bzT').textContent = 'กำลังเปิด' + (label ? ' ' + label : 'หน้าถัดไป') + '… • Opening' + (label ? ' ' + label : ' the next page') + '…';
    B.bar.hidden = false; B.bar.classList.remove('slow');
    clearTimeout(B.barT); B.barT = setTimeout(function () { if (B.bar && !B.bar.hidden) { B.bar.classList.add('slow'); B.bar.querySelector('.bzT').textContent += ' ' + lagText(SLOW + 1); } }, SLOW);
  }
  function guard(href, target, label) {
    if (!B.guard) {
      B.guard = document.createElement('div'); B.guard.className = 'bzGuard'; B.guard.setAttribute('role', 'alertdialog');
      B.guard.innerHTML = '<div class="bzGBox hud-frame"><span class="auroraLoader"><span></span></span><div><b>⏳ กำลังบันทึกอยู่ • Still saving</b>' +
        '<p class="bzGT"></p></div><div class="bzGB"><button type="button" class="btn-primary small" data-g="wait">รอให้เสร็จ • Wait</button>' +
        '<button type="button" class="btn-ghost small" data-g="go">ออกเลย • Leave anyway</button></div></div>';
      document.body.appendChild(B.guard);
      B.guard.addEventListener('click', function (e) {
        var g = e.target.closest('[data-g]'); if (!g) return;
        B.guard.hidden = true;
        if (g.dataset.g === 'go' && B.go) { var o = B.go; B.go = null; navBar(o.label); window.open(o.href, o.target || '_top'); }
        else B.go = null;
      });
    }
    B.go = { href: href, target: target, label: label };
    var now = B.labels.filter(String)[0];
    B.guard.querySelector('.bzGT').textContent = (now ? '⏳ ' + now + '\n' : '') + 'ถ้าออกตอนนี้อาจไม่ถูกบันทึก กด "รอ" แล้วระบบจะพาไป' + (label ? ' ' + label : '') + ' ให้เองเมื่อบันทึกเสร็จ • Leaving now may lose it. Press Wait and you will be taken there as soon as it is saved.';
    B.guard.hidden = false;
    clearInterval(B.gt); B.gt = setInterval(function () {               // the save finished while the box was open -> go on by itself
      if (B.n || !B.go) { if (!B.go) clearInterval(B.gt); return; }
      clearInterval(B.gt); var o = B.go; B.go = null; B.guard.hidden = true; navBar(o.label); window.open(o.href, o.target || '_top');
    }, 300);
  }
  function labelOf(a) {
    var n = a.querySelector && a.querySelector('.nm');
    var t = a.getAttribute('data-go-label') || (n ? n.textContent : a.textContent) || '';
    t = t.replace(/\s+/g, ' ').trim(); return t.length > 48 ? t.slice(0, 46) + '…' : t;
  }
  document.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
    var href = a.getAttribute('href') || '', tg = (a.getAttribute('target') || '').toLowerCase();
    if (!href || href.charAt(0) === '#' || /^javascript:/i.test(href) || tg === '_blank' || a.hasAttribute('download')) return;
    var card = a.closest('.modCard, .homeCard'); if (card) card.classList.add('going');
    if (B.n) { e.preventDefault(); if (card) card.classList.remove('going'); guard(a.href, tg || '_top', labelOf(a)); return; }
    try { localStorage.setItem('smv2_lastGo', JSON.stringify({ href: a.href, label: labelOf(a), t: Date.now() })); } catch (e2) {}   // 🔎 Home spots a link that lost its ?page= (17/10/2026 f)
    navBar(labelOf(a));
  }, true);
  window.addEventListener('beforeunload', function (e) { if (B.n) { e.preventDefault(); e.returnValue = ''; return ''; } });
  window.addEventListener('pageshow', function () {                  // back button: hide the "Opening…" bar again
    if (B.bar) B.bar.hidden = true;
    document.querySelectorAll('.going').forEach(function (c) { c.classList.remove('going'); });
  });
  window.SMV2Busy = { part: part, btn: btn, saving: saving, nav: navBar, pending: function () { return B.n; } };
})();
/* 🔎 SMV2Find (10/10/2026): search ignores spaces, dashes, dots, slashes — wq180 = wq-180 = wq 180 = WQ.180.
     SMV2Find.sq(s)                 -> "wq180" (lower case, no spaces / - _ . / · • ,)
     SMV2Find.hit(hay, toks, sqHay) -> every word is found as typed OR squashed; or the whole query squashed is found
                                       (hay = lower-case text; sqHay = SMV2Find.sq(hay), pass it when kept per item) */
(function () {
  var SQ = /[\s\-_.\/·•,]+/g;
  function sq(s) { return String(s || '').toLowerCase().replace(SQ, ''); }
  window.SMV2Find = {
    sq: sq,
    hit: function (hay, toks, sqHay) {
      if (!toks || !toks.length) return true;
      hay = String(hay || ''); if (sqHay === undefined) sqHay = sq(hay);
      var all = true;
      for (var i = 0; i < toks.length; i++) {
        var t = toks[i], s = sq(t);
        if (hay.indexOf(t) < 0 && (!s || sqHay.indexOf(s) < 0) && s) { all = false; break; }
      }
      if (all) return true;
      var whole = sq(toks.join(''));                                         // "wq 180" typed, "WQ180" stored
      return !!whole && sqHay.indexOf(whole) >= 0;
    }
  };
})();
</script>
<script>
/* Login screen (formerly SMV2_Login.html) — window.SMV2Auth — used by SMV2_View and SMV2_Stock.
   SMV2Auth.ensure(adminKey, onReady)  -> onReady(token, {name, admin}); shows the login screen when needed
   SMV2Auth.done()                     -> hides the "welcome + loading" box once the page has data
   SMV2Auth.handleError(err)           -> true when the error was "please log in" (login screen shown again)
   SMV2Auth.chip(el)                   -> "👤 name · Log out" in a page header
   The token lives in sessionStorage (gone when the browser closes); no PIN is ever stored. */
(function () {
  var KEY = 'smv2_viewer_token';
  var A = { token: '', name: '', admin: false, role: '', mapView: false, access: [], ready: null, el: null, shownAt: 0 };
  var ROLE_TXT = { SUPER: ['🔑', 'ผู้ดูแลสูงสุด', 'Super Admin'], ADMIN: ['🛡', 'ผู้ดูแล', 'Admin'], MANAGER: ['🧭', 'ผู้จัดการ', 'Manager'], VIEWER: ['👁', 'ผู้ดู', 'Viewer'] };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function load() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return A.token || ''; } }
  function save(t) { A.token = t; try { if (t) sessionStorage.setItem(KEY, t); else sessionStorage.removeItem(KEY); } catch (e) {} }
  function run(fn, args, ok, fail) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail);
    r[fn].apply(r, args || []);
  }

  function build() {
    if (A.el) return;
    var ov = document.createElement('div');
    ov.className = 'lgOverlay'; ov.hidden = true;
    ov.innerHTML =
      '<div class="lgCard hud-frame" id="lgCard">' +
        '<div class="lgForm">' +
          '<h2 class="lgTitle">STOCK MASTER</h2>' +
          '<p class="lgSub">เข้าสู่ระบบเพื่อดูสต๊อก • Log in to view stock</p>' +
          '<form id="lgForm" autocomplete="off">' +
            '<label class="lgField"><span>ชื่อผู้ใช้ • Name</span><input id="lgName" type="text" autocomplete="username" required></label>' +
            '<label class="lgField"><span>PIN (ตัวเลข 4–8 หลัก • 4–8 digits)</span><div class="lgPinWrap">' +
              '<input id="lgPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" required>' +
              '<button type="button" class="lgEye" id="lgEye" title="แสดง/ซ่อน PIN • Show / hide PIN">👁</button></div></label>' +
            '<button type="submit" class="btn-primary lgBtn" id="lgBtn">เข้าสู่ระบบ • Log in</button>' +
            '<p class="lgErr" id="lgErr"></p>' +
          '</form>' +
          '<p class="lgNote">ชื่อและ PIN ได้จากผู้ดูแลระบบ · ปิดเบราว์เซอร์แล้วต้องเข้าสู่ระบบใหม่ • ' +
            'Your name and PIN come from the admin. Closing the browser logs you out.</p>' +
        '</div>' +
        '<div class="lgOk">' +
          '<div class="lgOkIcon" id="lgOkIcon">✅</div>' +
          '<p class="lgOkName" id="lgOkName"></p>' +
          '<p class="lgSub" id="lgOkSub">เข้าสู่ระบบสำเร็จ • Logged in</p>' +
          '<div class="lgOkLoad"><span class="auroraLoader"><span></span></span><span class="auroraText">กำลังโหลดข้อมูล… • Loading…</span></div>' +
          '<div class="lgOkBar"><i></i></div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(ov);
    A.el = ov;
    $('lgEye').addEventListener('click', function () { var p = $('lgPin'); p.type = p.type === 'password' ? 'text' : 'password'; p.focus(); });
    $('lgPin').addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').slice(0, 8); });
    $('lgForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('lgName').value.trim(), pin = $('lgPin').value.trim(), btn = $('lgBtn');
      if (!name || !/^\d{4,8}$/.test(pin)) { $('lgErr').textContent = 'กรอกชื่อ และ PIN 4–8 หลัก • Enter your name and a 4–8 digit PIN'; return; }
      btn.disabled = true; btn.innerHTML = '<span class="auroraLoader tiny"><span></span></span> กำลังตรวจสอบ… • Checking…';
      $('lgErr').textContent = '';
      // Enter pressed (02/10/2026): switch to the "logging in" box at once; it becomes "Welcome" on success,
      // or flips back to the form with the error if the name / PIN is wrong
      $('lgPin').blur(); $('lgName').blur();
      setOk('🔐', 'กำลังเข้าสู่ระบบ… • Logging in…', 'ตรวจสอบชื่อและ PIN • Checking your name and PIN');
      $('lgCard').classList.add('ok', 'pending');
      run('smv2_login', [name, pin], function (r) {
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ • Log in';
        $('lgPin').value = '';
        save(r.token); A.name = r.name; A.role = r.role || 'VIEWER'; A.mapView = !!r.mapView; A.access = r.access || [];
        showWelcome(r.name);
        if (A.ready) A.ready(r.token, { name: r.name, admin: false, role: A.role });
      }, function (err) {
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ • Log in';
        $('lgCard').classList.remove('ok', 'pending');
        $('lgPin').value = ''; $('lgPin').focus();
        $('lgErr').textContent = String((err && err.message) || err).replace(/^Error:\s*/, '');
      });
    });
  }
  function showLogin(msg) {
    build();
    $('lgCard').classList.remove('ok');
    A.el.classList.remove('leaving'); A.el.hidden = false;
    document.body.classList.add('lgOn');             // 12/10/2026: background aurora paused under the login card (typing stays smooth)
    $('lgErr').textContent = msg || '';
    setTimeout(function () { ($('lgName').value ? $('lgPin') : $('lgName')).focus(); }, 60);
  }
  function setOk(icon, title, sub) {
    $('lgOkIcon').textContent = icon; $('lgOkName').textContent = title; $('lgOkSub').textContent = sub;
  }
  function showWelcome(name) {
    build();
    setOk('✅', 'ยินดีต้อนรับ, ' + name + ' • Welcome', 'เข้าสู่ระบบสำเร็จ • Logged in');
    $('lgCard').classList.remove('pending');
    $('lgCard').classList.add('ok');
    A.el.classList.remove('leaving'); A.el.hidden = false;
    A.shownAt = Date.now();
  }

  var API = {
    ensure: function (adminKey, onReady) {
      A.ready = onReady;
      var tok = adminKey || load();
      if (!tok) { showLogin(); return; }
      run('smv2_checkSession', [tok], function (r) {
        if (r && r.ok) {
          if (!adminKey) save(tok);
          A.name = r.name; A.admin = !!r.admin; A.role = r.role || (r.admin ? 'SUPER' : 'VIEWER'); A.mapView = !!r.mapView; A.access = r.access || [];
          onReady(tok, { name: r.name, admin: !!r.admin, role: A.role });
        } else {
          save('');
          showLogin(adminKey ? 'ลิงก์ผู้ดูแลไม่ถูกต้อง • The admin link is not valid' : 'หมดเวลา กรุณาเข้าสู่ระบบอีกครั้ง • Session ended — please log in again');
        }
      }, function () { showLogin(); });
    },
    /** call once the page has its first data: the welcome box fades away (shown at least 0.9 s) */

      }, wait);
    },
    handleError: function (err) {

      return true;
    },
    chip: function (host) {
      if (!host) return;
      host.innerHTML = '';
      if (A.admin) { host.innerHTML = '<span class="lgChip">🔑 <b>ผู้ดูแล • Admin</b><span class="roleTag r-SUPER">Super Admin</span></span>'; return; }
      var c = document.createElement('span'); c.className = 'lgChip';
      var rt = ROLE_TXT[A.role] || ROLE_TXT.VIEWER;
      c.innerHTML = '👤 <b>' + esc(A.name) + '</b><span class="roleTag r-' + esc(A.role || 'VIEWER') + '" title="' + rt[1] + ' • ' + rt[2] + '">' + rt[0] + ' ' + rt[2] + '</span>';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn-ghost small'; b.textContent = 'ออกจากระบบ • Log out';
      b.addEventListener('click', function () {
        var t = A.token || load();
        save('');
        if (t) run('smv2_logout', [t], function () {}, function () {});
        showLogin('ออกจากระบบแล้ว • Logged out');
      });
      c.appendChild(b); host.appendChild(c);
    },
    token: function () { return A.token || load(); },
    name: function () { return A.name; },
    /** 👥 'SUPER' (admin key) | 'MANAGER' | 'VIEWER' (10/10/2026) */
    role: function () { return A.admin ? 'SUPER' : (A.role || 'VIEWER'); },
    /** true when the current user has at least this role */
    can: function (min) { var R = { VIEWER: 1, MANAGER: 2, ADMIN: 3, SUPER: 4 }; return (R[API.role()] || 1) >= (R[min] || 1); },
    /** 🎚 one switch (16/10/2026 c): WH · NH · MAP-WH · MAP-NH · EDIT-WH · EDIT-NH · PHOTOS — Admin / Super Admin always */
    has: function (code) { return API.can('ADMIN') || (A.access || []).indexOf(code) >= 0; },
    /** 🗺 may open a map (any, or this site WH / NH) */
    mapView: function (site) { return site ? API.has('MAP-' + site) : (API.has('MAP-WH') || API.has('MAP-NH')); },
    /** 🛡 the key for admin server calls: the admin link's key, or an ADMIN login's session (16/10/2026 c) */
    adminKey: function (urlKey) { return urlKey || (API.role() === 'ADMIN' ? (A.token || load()) : ''); },
    /** a key that may go into a link: the admin link's key only — never a login session */
    urlKey: function (k) { return k && k !== (A.token || load()) ? k : ''; },
    /** true when the error is "your role cannot open this" (the page shows a note, not the login) */
    isRoleError: function (err) { return String((err && err.message) || err || '').indexOf('ROLE_REQUIRED') >= 0; },
    /** a "this page is for managers" box with a link to STOCK MASTER */
    roleBlock: function (host, url, err) {
      if (!host) return;
